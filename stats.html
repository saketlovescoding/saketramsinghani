    <main>

            <h1>Stats</h1>
            <p class="page-intro">Code activity, in numbers.</p>

            <div class="github-overview" id="github-overview">
                <div class="gh-stat">
                    <span class="gh-stat-value" id="gh-repos">-</span>
                    <span class="gh-stat-label">Public Repos</span>
                </div>
                <div class="gh-stat">
                    <span class="gh-stat-value" id="gh-followers">-</span>
                    <span class="gh-stat-label">Followers</span>
                </div>
                <div class="gh-stat">
                    <span class="gh-stat-value" id="gh-following">-</span>

                </div>
            </div>

            <h3 class="gh-section-title">Top Languages</h3>
            <div class="lang-bars" id="lang-bars"></div>

            <h3 class="gh-section-title">Contribution Streak</h3>
            <div class="stat-card stat-card--wide">
                <img id="streak-img" src="https://github-readme-streak-stats.herokuapp.com/?user=saketlovescoding&hide_border=true&background=F4F4F2&ring=B85C38&fire=B85C38&currStreakLabel=1A1C1F&sideLabels=1A1C1F&currStreakNum=1A1C1F&sideNums=6E7278&dates=6E7278" alt="GitHub Streak" loading="lazy">
            </div>

            <div class="stat-card stat-card--wide">

    <script>
        const USERNAME = 'saketlovescoding';

        const LANG_COLORS = {
            JavaScript: '#f1e05a',
            TypeScript: '#3178c6',
            HTML: '#e34c26',
            CSS: '#663399',
            Java: '#b07219',
            Python: '#3572A5',
            Shell: '#89e051'
        };

        async function fetchGitHubStats() {
            try {
                const [userRes, reposRes] = await Promise.all([
                    fetch('https://api.github.com/users/' + USERNAME),
                    fetch('https://api.github.com/users/' + USERNAME + '/repos?per_page=100&sort=updated')
                ]);

                if (!userRes.ok || !reposRes.ok) return;

                const user = await userRes.json();
                const repos = await reposRes.json();

                document.getElementById('gh-repos').textContent = user.public_repos;
                document.getElementById('gh-followers').textContent = user.followers;
                document.getElementById('gh-following').textContent = user.following;

                const langBytes = {};
                repos.forEach(function(repo) {
                    if (repo.language && !repo.fork) {
                        langBytes[repo.language] = (langBytes[repo.language] || 0) + (repo.size || 0);
                    }
                });

                const sorted = Object.entries(langBytes)
                    .sort(function(a, b) { return b[1] - a[1]; })
                    .slice(0, 5);

                const total = sorted.reduce(function(sum, entry) { return sum + entry[1]; }, 0);
                var container = document.getElementById('lang-bars');

                if (sorted.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">No language data available.</p>';
                    return;
                }

                var html = '';
                sorted.forEach(function(entry) {
                    var lang = entry[0];
                    var bytes = entry[1];
                    var pct = ((bytes / total) * 100).toFixed(1);
                    var color = LANG_COLORS[lang] || 'var(--accent)';
                    html += '<div class="lang-row">' +
                        '<div class="lang-info">' +
                            '<span class="lang-name">' +
                                '<span class="lang-dot" style="background:' + color + '"></span>' +
                                lang +
                            '</span>' +
                            '<span class="lang-pct">' + pct + '%</span>' +
                        '</div>' +
                        '<div class="lang-track">' +
                            '<div class="lang-fill" style="width:' + pct + '%;background:' + color + '"></div>' +
                        '</div>' +
                    '</div>';
                });
                container.innerHTML = html;

            } catch (e) {
                // Silently fail — stats just show dashes
            }
        }

        fetchGitHubStats();
    </script>

    <script src="js/site.js" defer></script>
